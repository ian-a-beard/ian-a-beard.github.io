<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture Lens: Movie Recommender</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; line-height: 1.6; }
        select, button { width: 100%; padding: 10px; margin-top: 10px; font-size: 16px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>🎥 Culture Lens Recommender</h2>
    <p>Select a movie to see what your TF-IDF content model suggests next:</p>

    <!-- Searchable dropdown list using native HTML5 datalist -->
    <input list="movies" id="movie-choice" placeholder="Type a movie name..." style="width: 100%; padding: 10px; font-size: 16px;">
    <datalist id="movies"></datalist>

    <button onclick="getRecommendations()">Get Recommendations</button>

    <h3>Recommended Movies:</h3>
    <ul id="results-list"></ul>

    <script>
        let recData = {};

        // 1. Fetch the static JSON file when the page loads
        fetch('recommendations.json')
            .then(response => response.json())
            .then(data => {
                recData = data;
                const datalist = document.getElementById('movies');
                
                // Populates the dropdown menu with all available movie titles
                Object.keys(data).sort().forEach(title => {
                    let option = document.createElement('option');
                    option.value = title;
                    datalist.appendChild(option);
                });
            });

        // 2. Look up the chosen movie and display the pre-computed array
        function getRecommendations() {
            const choice = document.getElementById('movie-choice').value;
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = ""; // Clear old results

            if (recData[choice]) {
                recData[choice].forEach(movie => {
                    let li = document.createElement('li');
                    li.textContent = movie;
                    resultsList.appendChild(li);
                });
            } else {
                let li = document.createElement('li');
                li.textContent = "Movie not found. Please select an option from the list.";
                resultsList.appendChild(li);
            }
        }
    </script>
</body>
</html>
